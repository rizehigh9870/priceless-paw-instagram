name: Instagram 自動投稿

on:
  schedule:
    # 毎日 JST 10:43 頃に実行（UTC 1:43 = JST 10:43）
    # ※GitHub Actionsのscheduleは「00分」など区切りの良い時刻に実行が集中し遅延しやすいため、
    #   あえて半端な分（43分）を指定して混雑を避けている。それでも数分〜数十分の遅延はあり得る。
    - cron: "43 1 * * *"
  workflow_dispatch: {}  # 手動実行もできるようにしておく

# 投稿完了フォルダの移動をコミット・プッシュするために書き込み権限を付与
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なパッケージをインストール
        run: pip install requests

      - name: Instagramへ投稿
        id: ig_post
        # Instagram投稿が失敗しても、後続のThreads投稿ステップは実行させたい
        # （移動ステップ側でInstagramの成否を見て判断するため）
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_to_instagram.py

      - name: Threadsへ投稿
        # Threads用Secrets未設定の場合はスクリプト内でスキップされる。
        # Threads投稿が失敗してもInstagram投稿の結果（フォルダ移動）には影響させないため、
        # ここではワークフロー全体を失敗させない。
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/post_to_threads.py

      - name: 投稿完了フォルダを移動
        # Instagram投稿が成功した場合のみ移動する（Threadsの成否は問わない）
        if: steps.ig_post.outcome == 'success'
        run: python scripts/move_completed_folder.py

      - name: Instagram投稿が失敗していた場合はジョブ全体を失敗扱いにする
        # continue-on-error で握りつぶした失敗を、ここで明示的にActionsの実行結果へ反映する
        if: steps.ig_post.outcome == 'failure'
        run: exit 1

      - name: 変更があればコミット・プッシュ（投稿完了フォルダの移動を反映）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: 投稿完了フォルダを■済へ移動 [auto]"
          git push
