name: Instagram 自動投稿

on:
  schedule:
    # 毎日 JST 5:47 頃に実行（UTC 20:47 前日 = JST 5:47）
    # ※GitHub Actionsのscheduleは「00分」など区切りの良い時刻に実行が集中し遅延しやすいため、
    #   あえて半端な分（47分）を指定して混雑を避けている。それでも数分〜数十分の遅延はあり得る。
    # 2026-09-04: 10:43頃の実行だと投稿が遅れがちだったため、6:00頃を狙って5:47に変更
    - cron: "47 20 * * *"
  workflow_dispatch: {}  # 手動実行もできるようにしておく

# 投稿完了フォルダの移動をコミット・プッシュするために書き込み権限を付与
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 必要なパッケージをインストール
        run: pip install requests

      - name: Instagramへ投稿
        id: ig_post
        # Instagram投稿が失敗しても、後続のThreads投稿ステップは実行させたい
        # （移動ステップ側でInstagramの成否を見て判断するため）
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_to_instagram.py

      - name: Threadsへ投稿
        id: threads_post
        # Threads用Secrets未設定の場合はスクリプト内でスキップされる。
        # Threads投稿が失敗してもInstagram投稿の結果（フォルダ移動）には影響させないため、
        # ここではワークフロー全体を失敗させない。
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/post_to_threads.py

      - name: Instagramストーリーズへ投稿
        id: story_post
        # ストーリーズ投稿はフィード投稿・Threads投稿と独立したメディアのため、
        # 失敗してもフォルダ移動やジョブ全体には影響させない。
        # ★リンクスタンプはGraph API非対応のため画像投稿のみ行う。
        #   リンクスタンプの追加は運用者がInstagramアプリで毎日手動で行う（申し送りログにも記載）。
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_to_story.py

      - name: 投稿完了フォルダを移動
        id: move_folder
        # Instagram投稿が成功した場合のみ移動する（Threadsの成否は問わない）
        if: steps.ig_post.outcome == 'success'
        run: python scripts/move_completed_folder.py

      - name: 申し送りログに追記（AIカンパニー構想 /log 運用）
        # 「ログ追記が終わるまでタスク完了とみなさない」という完了条件のためのステップ。
        # if: always() でInstagram/Threadsの成否によらず必ず実行する。
        # このステップが失敗した場合はタスク未完了とみなし、ジョブ全体も失敗になる
        # （continue-on-error を付けないのは意図的）。
        if: always()
        env:
          IG_OUTCOME: ${{ steps.ig_post.outcome }}
          THREADS_OUTCOME: ${{ steps.threads_post.outcome }}
          STORY_OUTCOME: ${{ steps.story_post.outcome }}
          POSTED_FOLDER: ${{ steps.move_folder.outputs.posted_folder }}
        run: python scripts/write_daily_log.py

      - name: Instagram投稿が失敗していた場合はジョブ全体を失敗扱いにする
        # continue-on-error で握りつぶした失敗を、ここで明示的にActionsの実行結果へ反映する
        if: steps.ig_post.outcome == 'failure'
        run: exit 1

      - name: 変更があればコミット・プッシュ（投稿完了フォルダの移動・ログ追記を反映）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: 投稿完了フォルダの移動・申し送りログの追記 [auto]"
          git push
